services:
  - type: web
    name: pacsd-api
    runtime: node
    plan: free
    buildCommand: npm ci --workspace server --include-workspace-root
    startCommand: npm run start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: SESSION_SECRET
        generateValue: true
      - key: PUBLIC_BASE_URL
        sync: false
      - key: WEB_ORIGIN
        sync: false
