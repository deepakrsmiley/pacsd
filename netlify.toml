[build]
  command = "npm run build"
  publish = "client/dist"

[build.environment]
  NODE_VERSION = "22"
  MONGOMS_DISABLE_POSTINSTALL = "1"

# Replace pacsd-api.onrender.com with your Render service URL.
[[redirects]]
  from = "/api/*"
  to = "https://pacsd-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
